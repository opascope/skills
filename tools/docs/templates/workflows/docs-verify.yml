# manage-docs verify (manage-docs v2 section 6; contract sections 2 and 5).
# Vendored by `docs.py init --stage pr1`; changes only in a docs/bootstrap or docs/upgrade-<sha> PR (X6).
#
# docs-verify (REQUIRED by the ruleset): runs on pull_request_target, so the workflow AND the checker
# come from the BASE branch. The PR head is checked out as data only (never executed), and the
# base engine checks it: `docs.py check --pr <base>`. Drift is an annotation, never a failure (R7).
#
# Scope first. The check is required, so it must report on every PR; a workflow-level `paths:`
# filter would leave it missing and block the merge. Instead the first step, before any checkout,
# lists the PR's files through the API (each filename and any previous filename) and asks whether
# the PR touches anything `docs.py check --pr` reads: a Markdown, MDX or reStructuredText file,
# anything under docs/, work/, .beads/, __VENDOR_DIR__/ or a work-items folder, docs.json, or this
# workflow. Markdown under a folder the repo's seed lists in `docs_verify_skip` (each one a folder
# its docs.json inventory_exclude already keeps out of every check, such as changelog fragments)
# does not count. When nothing counts, every later step is skipped and the job reports success in
# seconds. It fails open: a listing error, a count that disagrees with the PR's changed_files (the
# API stops at 3,000 files), or a failure of the step itself runs the full check. An `edited` event
# that changed the base branch always runs the full check. Any other edit (title or body) decides
# by the same file list, so a docs PR re-runs the full check and keeps its verdict; skipping it
# there would post a green docs-verify over a red one on the same head commit.
#
# A bootstrap PR (the one that adds this workflow) gets no docs-verify run: its base has no
# workflow yet. Its proof is the local trust-root proof in its body (`init --stage pr1`).
#
# The job runs on the repo's seeded runner (site.json `runs_on`, default the self-hosted pool,
# [self-hosted, ci-group]), so this check runs where the rest of the repo's CI runs.
name: docs-verify

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: docs-verify-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs-verify:
    runs-on: __RUNS_ON__
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "__PYTHON_VERSION__"
      - name: Scope (does this PR change anything docs.py check reads?)
        id: scope
        # fail open: if this step errors or times out, `relevant` stays unset and the full check runs
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_CHANGE: ${{ toJSON(github.event.changes.base) }}
          VENDOR_DIR: "__VENDOR_DIR__"
          SKIP_DIRS: "__DOCS_VERIFY_SKIP__"
        shell: python
        run: |
          import json, os, re, sys, urllib.request

          def decide(relevant, why):
              # a filename or an error can hold a newline; strip control characters so nothing printed
              # here can start a line that the runner reads as a workflow command
              why = re.sub(r"[\x00-\x1f\x7f]", "?", str(why))
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write(f"relevant={'true' if relevant else 'false'}\n")
              if relevant:
                  print(f"docs-verify scope: full check ({why})")
              else:
                  print(f"::notice title=docs-verify::No docs input changed ({why}); the check passes without running.")
              sys.exit(0)

          if os.environ.get("EVENT_ACTION") == "edited" and os.environ.get("BASE_CHANGE", "null") not in ("", "null"):
              decide(True, "the PR's base branch changed")
          try:
              expected = int(os.environ["CHANGED_FILES"])
          except (KeyError, ValueError):
              decide(True, "the event carries no changed_files count")

          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          url = f"{api}/repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{os.environ['PR_NUMBER']}/files?per_page=100"
          names, listed = [], 0
          try:
              for _ in range(40):  # the API lists at most 3,000 files, 30 pages of 100
                  req = urllib.request.Request(url, headers={
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      page = json.load(resp)
                      link = resp.headers.get("Link") or ""
                  for f in page:
                      listed += 1
                      names += [f["filename"]] + ([f["previous_filename"]] if f.get("previous_filename") else [])
                  nxt = re.search(r'<([^>]+)>;\s*rel="next"', link)
                  if not nxt:
                      break
                  url = nxt.group(1)
              else:
                  decide(True, "the file listing did not end")
          except Exception as exc:  # any API or parse failure runs the full check
              decide(True, f"could not list the PR's files: {exc}")
          if listed != expected:
              decide(True, f"listed {listed} files, the PR says {expected}")

          vendor = os.environ["VENDOR_DIR"].strip("/")
          skip = [d.strip("/") + "/" for d in os.environ.get("SKIP_DIRS", "").split()]
          always = ("docs/", "work/", ".beads/", vendor + "/")
          exact = {"docs.json", ".github/workflows/docs-verify.yml"}

          def counts(path):
              if path in exact or path.startswith(always) or re.search(r"(^|/)work-?items/", path, re.I):
                  return True
              return path.lower().endswith((".md", ".mdx", ".rst")) and not path.startswith(tuple(skip))

          hit = next((p for p in names if counts(p)), None)
          if hit:
              decide(True, f"{hit!r} is a docs input")
          decide(False, f"{listed} files, none a docs input")
      - name: Checkout base (trusted code)
        if: steps.scope.outputs.relevant != 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      # Bandwidth: on a self-hosted runner other jobs' `git clean -ffdx` of the root workspace removes
      # head/, so every full check cloned the whole repository again (fetch-depth 0, every branch).
      # When the root workspace is a full (not shallow) clone of this repo, seed head/ with it as a
      # git alternate: the checkout below then reuses the directory and fetches only objects the root
      # lacks. The fetched refs and the checked-out head are the same as a fresh clone. Objects are
      # content-addressed, so borrowing changes no byte of the data the check reads; base/ (the
      # trusted checker) is never seeded. A shallow or foreign root, a hosted runner or any failure
      # leaves no head/ behind, and actions/checkout recreates a directory it cannot reset, so the
      # worst case is the old full clone.
      - name: Seed the PR head checkout from this runner's full workspace
        if: steps.scope.outputs.relevant != 'false'
        continue-on-error: true
        run: |
          root="$GITHUB_WORKSPACE"
          dest="$GITHUB_WORKSPACE/head"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if [ -e "$dest" ]; then
            echo "head/ already exists; the checkout reuses or recreates it"
            exit 0
          fi
          if [ ! -d "$root/.git/objects" ] || [ -f "$root/.git/shallow" ] ||
            [ "$(git -C "$root" config --local --get remote.origin.url 2>/dev/null)" != "$url" ] ||
            ! head="$(git -C "$root" rev-parse --verify -q 'HEAD^{commit}')"; then
            echo "No full root workspace to borrow from; the checkout clones"
            exit 0
          fi
          if git init -q "$dest" &&
            git -C "$dest" remote add origin "$url" &&
            printf '%s\n' "$root/.git/objects" > "$dest/.git/objects/info/alternates" &&
            git -C "$dest" update-ref --no-deref HEAD "$head"; then
            echo "Borrowing objects from the root workspace at $head"
          else
            rm -rf -- "$dest"
            echo "::notice::Could not seed head/; the checkout clones"
          fi
      - name: Checkout PR head (data only)
        if: steps.scope.outputs.relevant != 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - name: Check
        if: steps.scope.outputs.relevant != 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ ! -f base/__VENDOR_DIR__/docs.py ]; then
            echo "base has no __VENDOR_DIR__ yet (bootstrap PR): nothing to check it with"
            exit 0
          fi
          git -C head cat-file -e "$BASE_SHA" 2>/dev/null || git -C head fetch -q origin "$BASE_SHA"
          python3 base/__VENDOR_DIR__/docs.py --repo head check --pr "$BASE_SHA" --head-ref "$HEAD_REF" --annotate
